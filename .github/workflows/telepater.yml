name: telepater postpost til raspberry pi
on:
  push:
    branches: [ main ]

jobs:
  telepater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: vi sætter deno op
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x

      - name: vi bygger siden
        run: deno task lume

      - name: telepaterer til raspberry pi
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "_site/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: "/var/www/pbmalerier.dk/"
          SCRIPT_BEFORE: |
            whoami
            ls -al
          SCRIPT_AFTER: |
            whoami
            ls -al
            echo $RSYNC_STDOUT